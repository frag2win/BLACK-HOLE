name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run project build and tests
        run: |
          echo "Verifying repository structure and running build/tests..."
          ls -la
          if [ -f package.json ]; then
            npm install
            npm test --if-present
            npm run build --if-present
          else
            test -f index.html && echo "index.html verified successfully"
          fi

      - name: Build Docker image
        run: docker build -t frag2win/devops-mini-project:latest .

      - name: Verify Docker image in local registry
        run: docker images | grep devops-mini-project
